name: Temporary sync Energy 4.3.16 candidate

on:
  push:
    branches:
      - fix/4.3.16-strict-solar-product-hierarchy
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-energy-4316-sync-v2
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/4.3.16-strict-solar-product-hierarchy
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: npm ci
      - run: |
          npm run release:sync
          npm run build
      - name: Commit exact candidate package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json COMPATIBILITY.json RELEASE_MANIFEST.json release/RELEASE_STATUS.json release/QUALIFICATION.json dist
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: resynchronize Energy UX 4.3.16 candidate"
          git push origin HEAD:fix/4.3.16-strict-solar-product-hierarchy
