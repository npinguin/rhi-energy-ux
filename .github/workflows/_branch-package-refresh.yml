name: Branch package refresh

on:
  push:
    branches:
      - feat/registry-driven-flexible-visuals

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feat/registry-driven-flexible-visuals
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - name: Commit deterministic dist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist
          if git diff --cached --quiet; then
            echo "dist already clean"
            exit 0
          fi
          git commit -m "build: refresh deterministic 4.3.5 dist"
          git push origin HEAD:feat/registry-driven-flexible-visuals
