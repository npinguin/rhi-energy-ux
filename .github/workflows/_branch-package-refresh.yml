name: Branch package refresh
on:
  push:
    branches: [release/4.3.6-asset-visual-runtime-fix]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: { ref: release/4.3.6-asset-visual-runtime-fix }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: { node-version: '24' }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: { python-version: '3.12' }
      - run: npm ci
      - run: npm run build
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: refresh deterministic Energy UX 4.3.6 dist"
          git push origin HEAD:release/4.3.6-asset-visual-runtime-fix
