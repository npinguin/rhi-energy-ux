name: Sync generated dist once

on:
  push:
    branches:
      - refactor/4.1.1-core-1.3-branding
    paths-ignore:
      - 'dist/**'

permissions:
  contents: write

jobs:
  sync-dist:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: refactor/4.1.1-core-1.3-branding
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - name: Commit deterministic dist
        run: |
          if git diff --quiet -- dist; then
            echo "dist already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "Sync 4.1.1 deterministic dist"
          git push origin HEAD:refactor/4.1.1-core-1.3-branding
