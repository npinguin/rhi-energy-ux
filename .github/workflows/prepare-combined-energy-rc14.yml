name: Prepare combined Energy rc14 candidate

on:
  push:
    branches:
      - fix/energy-unified-recovery-release-20261012

permissions:
  contents: write

concurrency:
  group: energy-unified-rc14-preparation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/energy-unified-recovery-release-20261012
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run release:sync
      - run: npm run validate
      - run: npm run release:check
      - name: Reject canonical debt, verify second deterministic build
        shell: bash
        run: |
          set -euo pipefail
          node tools/audit-canonical-dependencies.mjs --fail-on-legacy
          cp -a dist /tmp/rhi-energy-rc14-dist
          npm run build
          diff -qr /tmp/rhi-energy-rc14-dist dist
      - name: Commit exact validated HACS tree and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json COMPATIBILITY.json RELEASE_MANIFEST.json release/RELEASE_STATUS.json release/QUALIFICATION.json dist
          git rm -f .github/workflows/prepare-combined-energy-rc14.yml
          git commit -m "build(energy UX): reproducible immutable rc14 HACS candidate"
          git push origin HEAD:fix/energy-unified-recovery-release-20261012
