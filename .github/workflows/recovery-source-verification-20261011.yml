name: Energy recovery source/package verification (single use)
on:
  push:
    branches:
      - work/ux-structural-closure-20261011
    paths:
      - .github/workflows/recovery-source-verification-20261011.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ux-structural-closure-20261011
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full source, UX, HACS and package verification
        run: |
          npm ci
          npm run validate
          node tools/check-committed-dist.mjs
          npm run test:release
      - name: Retire one-time workflow on success only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/recovery-source-verification-20261011.yml
          git commit -m 'chore: retire completed recovery source-verification workflow'
          git push origin HEAD:refs/heads/work/ux-structural-closure-20261011

# Retry with real native-energy metric fixture loaded in current-energy regression.
