name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source / package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci
      - name: Fail fast on source syntax and committed package drift
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run check:syntax
          node tools/check-committed-dist.mjs
      - name: Full validation
        run: npm run validate
      - name: Deterministic two-build proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/rhi-energy-first-dist
          cp -a dist /tmp/rhi-energy-first-dist
          npm run build
          diff -qr /tmp/rhi-energy-first-dist dist

  hacs:
    name: HACS
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: HACS validation
        uses: hacs/action@885037da508419fd08c13515967aec868dfdee2d
        with:
          category: plugin

  gate:
    name: RHI UX / Validate
    if: always()
    needs: [source, hacs]
    runs-on: ubuntu-latest
    steps:
      - name: Require all gates
        env:
          SOURCE: ${{ needs.source.result }}
          HACS: ${{ needs.hacs.result }}
        run: |
          set -euo pipefail
          test "$SOURCE" = success
          test "$HACS" = success
      - name: Summary
        if: always()
        env:
          SOURCE: ${{ needs.source.result }}
          HACS: ${{ needs.hacs.result }}
        run: |
          {
            echo '## RHI Energy UX validation'
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Complete dist package + owned tests: ${SOURCE}"
            echo "- Deterministic second-build proof: included"
            echo "- HACS repository validation: ${HACS}"
            echo "- Simulated HACS full-tree install: included in package tests"
            echo "- Publication rebuilds: none"
          } >> "$GITHUB_STEP_SUMMARY"
