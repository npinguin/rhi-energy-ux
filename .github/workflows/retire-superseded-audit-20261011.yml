name: Retire superseded Energy audit ref (single use)
on:
  push:
    branches: [work/ux-structural-closure-20261011]
    paths: [.github/workflows/retire-superseded-audit-20261011.yml]
permissions:
  contents: write
  pull-requests: read
jobs:
  retire-old-audit:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/ux-structural-closure-20261011
          persist-credentials: true
      - name: Prove all audit commits preserved by descendant and ref unchanged
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          OLD='chore/canonical-only-migration-audit'
          DESC='work/ux-structural-closure-20261011'
          expected='9238733b5819e1b60be09519acecd4d5423a1ec2'
          test "$(git rev-parse refs/remotes/origin/$OLD)" = "$expected"
          git merge-base --is-ancestor "$expected" "refs/remotes/origin/$DESC"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$OLD" --jq '.object.sha')" = "$expected"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open" --jq '[.[]|select(.head.ref=="chore/canonical-only-migration-audit")]|length')" = 0
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$OLD"
          echo "Retired $OLD at $expected; all history retained by $DESC" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove this one-time workflow from active branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/retire-superseded-audit-20261011.yml
          git commit -m 'chore: retire temporary branch-audit workflow'
          git push origin HEAD:refs/heads/work/ux-structural-closure-20261011
