name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-stable-release
  cancel-in-progress: false

jobs:
  release:
    name: Qualified stable promotion
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main qualification record
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Require completed target runtime qualification
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          q=json.loads(Path("release/QUALIFICATION.json").read_text(encoding="utf-8"))
          assert q["release_decision"] == "PASS", "target HA qualification is not PASS"
          assert q["runtime_proof"] == "PASS", "runtime proof is not PASS"
          assert q["rollback_proof"] == "PASS", "rollback proof is not PASS"
          assert q["known_accepted_technical_debt"] == 0
          assert q["known_accepted_feature_debt"] == 0
          assert re.fullmatch(r"[0-9a-fA-F]{40}", str(q.get("candidate_sha",""))), "candidate_sha is not bound"
          PY
      - name: Verify exact immutable candidate payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG=$(python -c "import json; print(json.load(open('release/QUALIFICATION.json'))['candidate_tag'])")
          CANDIDATE_SHA=$(python -c "import json; print(json.load(open('release/QUALIFICATION.json'))['candidate_sha'])")
          test "$TAG" = "v${VERSION}"
          git fetch --tags --force
          TAG_SHA=$(git rev-list -n 1 "${TAG}" 2>/dev/null || true)
          test "$TAG_SHA" = "$CANDIDATE_SHA"
          RELEASE_SHA=$(gh release view "${TAG}" --json targetCommitish --jq '.targetCommitish')
          test "$RELEASE_SHA" = "$CANDIDATE_SHA"
          test "$(gh release view "${TAG}" --json isPrerelease --jq '.isPrerelease')" = false

          rm -rf /tmp/rhi-energy-ux-release
          mkdir -p /tmp/rhi-energy-ux-release
          gh release download "${TAG}" --pattern 'rhi-energy-ux.js' --dir /tmp/rhi-energy-ux-release
          gh release download "${TAG}" --pattern 'rhi-energy-ux.js.sha256' --dir /tmp/rhi-energy-ux-release
          git show "${TAG}:dist/rhi-energy-ux.js" > /tmp/rhi-energy-ux-tag.js
          cmp /tmp/rhi-energy-ux-tag.js /tmp/rhi-energy-ux-release/rhi-energy-ux.js
          (cd /tmp/rhi-energy-ux-release && sha256sum -c rhi-energy-ux.js.sha256)
      - name: Promote exact candidate to stable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(python -c "import json; print(json.load(open('release/QUALIFICATION.json'))['candidate_tag'])")
          gh release upload "${TAG}" release/QUALIFICATION.json --clobber
          gh release edit "${TAG}" \
            --title "RHI Energy UX ${TAG}" \
            --notes-file release/RELEASE_NOTES.md
          test "$(gh release view "${TAG}" --json isPrerelease --jq '.isPrerelease')" = false
      - name: Summary
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CANDIDATE_SHA=$(python -c "import json; print(json.load(open('release/QUALIFICATION.json'))['candidate_sha'])")
          {
            echo '## RHI Energy UX stable promotion'
            echo "- Version: v${VERSION}"
            echo "- Candidate SHA: ${CANDIDATE_SHA}"
            echo "- Rebuild during promotion: NO"
            echo "- Target HA qualification: PASS"
            echo "- Published candidate runtime: EXACT TAG MATCH"
            echo "- Stable promotion: COMPLETE"
          } >> "$GITHUB_STEP_SUMMARY"
