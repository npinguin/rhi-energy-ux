name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-stable-release
  cancel-in-progress: false

jobs:
  release:
    name: Qualified stable promotion
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Full source/package validation
        run: npm run validate
      - name: Require completed target runtime qualification
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path("release/QUALIFICATION.json").read_text(encoding="utf-8"))
          assert q["release_decision"] == "PASS", "target HA qualification is not PASS"
          assert q["runtime_proof"] == "PASS", "runtime proof is not PASS"
          assert q["rollback_proof"] == "PASS", "rollback proof is not PASS"
          assert q["known_accepted_technical_debt"] == 0
          assert q["known_accepted_feature_debt"] == 0
          PY
      - name: Verify exact immutable candidate payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          git fetch --tags --force
          test -n "$(git rev-list -n 1 "${TAG}" 2>/dev/null || true)"
          test "$(gh release view "${TAG}" --json isPrerelease --jq '.isPrerelease')" = true
          rm -rf /tmp/rhi-energy-ux-release
          mkdir -p /tmp/rhi-energy-ux-release
          gh release download "${TAG}" --pattern 'rhi-energy-ux.js' --dir /tmp/rhi-energy-ux-release
          gh release download "${TAG}" --pattern 'rhi-energy-ux.js.sha256' --dir /tmp/rhi-energy-ux-release
          cmp dist/rhi-energy-ux.js /tmp/rhi-energy-ux-release/rhi-energy-ux.js
          (cd /tmp/rhi-energy-ux-release && sha256sum -c rhi-energy-ux.js.sha256)
      - name: Promote exact candidate to stable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          gh release edit "${TAG}" \
            --prerelease=false \
            --title "RHI Energy UX ${TAG}" \
            --notes-file release/RELEASE_NOTES.md
          test "$(gh release view "${TAG}" --json isPrerelease --jq '.isPrerelease')" = false
      - name: Summary
        run: |
          VERSION=$(node -p "require('./package.json').version")
          {
            echo '## RHI Energy UX stable promotion'
            echo "- Version: v${VERSION}"
            echo "- Source/package/tests: PASS"
            echo "- Target HA qualification: PASS"
            echo "- Published candidate runtime: EXACT MATCH"
            echo "- Stable promotion: COMPLETE"
            echo "- Rollback: previous immutable HACS releases remain selectable"
          } >> "$GITHUB_STEP_SUMMARY"
