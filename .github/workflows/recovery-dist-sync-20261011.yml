name: Recovery branch package synchronization (single use)
on:
  push:
    branches:
      - work/ux-structural-closure-20261011
    paths:
      - .github/workflows/recovery-dist-sync-20261011.yml
permissions:
  contents: write
jobs:
  rebuild-and-retire:
    if: github.ref == 'refs/heads/work/ux-structural-closure-20261011'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact work branch
        uses: actions/checkout@v4
        with:
          ref: work/ux-structural-closure-20261011
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build distributable from source, do not change tests or release identity
        run: |
          npm ci
          npm run build
          node --check dist/rhi-energy-ux.js
      - name: Commit exact generated package and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/recovery-dist-sync-20261011.yml
          git add -A dist/
          git diff --cached --stat
          git commit -m 'build: synchronize Energy recovery distribution with canonical source'
          git push origin HEAD:refs/heads/work/ux-structural-closure-20261011
