name: Canonical Energy cutover qualification
on:
  push:
    branches: [work/ux-structural-closure-20261011]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          npm ci
          npm run validate
          node tools/check-committed-dist.mjs
          npm run test:release
          node validation/test_native_energy_backend_interfaces.js
