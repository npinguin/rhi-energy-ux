name: Temporary Energy 4.3.1 candidate build

on:
  push:
    branches:
      - fix/energy-asset-tabs-4.3.1

permissions:
  contents: write

jobs:
  build-and-sync:
    if: github.event.head_commit.message != 'build: synchronize Energy UX 4.3.1 candidate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/energy-asset-tabs-4.3.1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize release metadata
        run: npm run release:sync
      - name: Validate and build exact candidate
        run: npm test
      - name: Commit deterministic candidate outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json COMPATIBILITY.json RELEASE_MANIFEST.json release/RELEASE_STATUS.json release/QUALIFICATION.json dist
          if git diff --cached --quiet; then
            echo "Candidate outputs already synchronized."
            exit 0
          fi
          git commit -m "build: synchronize Energy UX 4.3.1 candidate"
          git push origin HEAD:fix/energy-asset-tabs-4.3.1
