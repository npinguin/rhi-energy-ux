name: Sync Energy 4.3.2 dist

on:
  push:
    branches:
      - fix/92-complete-primary-details-4.3.2
    paths-ignore:
      - "dist/**"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/92-complete-primary-details-4.3.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python tools/build.py
      - name: Commit exact deterministic dist
        run: |
          if git diff --quiet -- dist; then
            echo "dist already exact"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "build: sync exact Energy UX 4.3.2 dist"
          git push origin HEAD:fix/92-complete-primary-details-4.3.2
