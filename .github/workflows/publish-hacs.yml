name: Publish HACS

on:
  push:
    branches: [main]
    paths:
      - 'dist/rhi-energy-ux.js'
      - 'dist/assets/**'
      - 'COMPATIBILITY.json'
      - 'RELEASE_MANIFEST.json'
      - 'release/RELEASE_NOTES.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-publish-candidate
  cancel-in-progress: false

jobs:
  verify:
    name: Verify validated candidate artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact main candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Reject immutable version republish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null || gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Immutable candidate ${TAG} already exists; refusing republish." >&2
            exit 1
          fi
      - name: Verify committed artifact and release metadata
        run: |
          python validation/validate_hacs_package.py
          python validation/validate_public_repository.py
          python validation/validate_release_governance.py
          python validation/validate_test_ownership.py
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: plugin

  publish:
    name: Publish exact TEST CANDIDATE artifact
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Verify exact committed payload
        run: python validation/validate_hacs_package.py
      - name: Publish immutable version and rollback assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null || gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Immutable candidate ${TAG} already exists; refusing republish." >&2
            exit 1
          fi
          sha256sum dist/rhi-energy-ux.js > /tmp/rhi-energy-ux.js.sha256
          git tag "${TAG}" "$GITHUB_SHA"
          git push origin "${TAG}"
          gh release create "${TAG}" \
            --target "$GITHUB_SHA" \
            --title "RHI Energy UX ${TAG} — TEST CANDIDATE" \
            --notes-file release/RELEASE_NOTES.md \
            dist/rhi-energy-ux.js \
            /tmp/rhi-energy-ux.js.sha256 \
            dist/BUILD_MANIFEST.json \
            COMPATIBILITY.json \
            RELEASE_MANIFEST.json \
            release/QUALIFICATION.json
          test "$(gh release view "${TAG}" --json isPrerelease --jq '.isPrerelease')" = false
      - name: Summary
        run: |
          VERSION=$(node -p "require('./package.json').version")
          {
            echo '## RHI Energy UX HACS publication'
            echo "- Version: v${VERSION}"
            echo "- Artifact: exact committed PR-validated dist"
            echo "- Rebuild during publication: NO"
            echo "- HACS validation: PASS"
            echo "- Immutable HACS-visible TEST CANDIDATE: PUBLISHED"
          } >> "$GITHUB_STEP_SUMMARY"
