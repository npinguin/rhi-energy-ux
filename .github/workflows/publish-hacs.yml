name: Publish HACS

on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

env:
  CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

concurrency:
  group: ${{ github.repository }}-publish-candidate
  cancel-in-progress: false

jobs:
  scope:
    name: Determine candidate publication
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.scope.outputs.publish }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - name: Checkout exact validated main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Enforce coordinated source-closure publication freeze
        id: coordinated
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          gate = json.loads(Path("release/COORDINATED_PUBLICATION_GATE.json").read_text(encoding="utf-8"))
          approval = gate.get("approval") or {}
          required = ("source_closure_approved", "five_package_matrix_verified", "foundation_129_approval")
          allowed = (
              os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
              and gate.get("iteration_id") == "RHI_NEXT_ZERO_DEBT_PRODUCT_CLOSURE"
              and gate.get("publication_hold") is False
              and gate.get("mode") == "MANUAL_COORDINATED_SOURCE_CLOSURE_ONLY"
              and all(
                  isinstance(approval.get(key), str)
                  and approval[key].startswith("https://github.com/npinguin/")
                  for key in required
              )
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"allowed={str(allowed).lower()}\n")
          print("Coordinated HACS publication authorized" if allowed else
                "HOLD: source and UX engineering PR merges may proceed; no new HACS TEST")
          PY
      - name: Determine whether this version is publishable
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.coordinated.outputs.allowed }}" != "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "reason=coordinated_source_closure_hold" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "reason=version_already_published" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "reason=new_candidate_version" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: scope
    if: >-
      needs.scope.outputs.publish == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main'))
    name: Verify validated HACS package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact main candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify committed package and release metadata
        run: |
          npm run release:check
          python validation/validate_hacs_package.py
          python validation/test_hacs_install.py
          python validation/validate_public_repository.py
      - name: Verify immutable candidate state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          git fetch --tags --force

          TAG_EXISTS=false
          RELEASE_EXISTS=false
          git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null && TAG_EXISTS=true
          gh release view "${TAG}" >/dev/null 2>&1 && RELEASE_EXISTS=true

          if [ "$RELEASE_EXISTS" = true ] && [ "$TAG_EXISTS" != true ]; then
            echo "Release ${TAG} exists without immutable tag." >&2
            exit 1
          fi

          if [ "$TAG_EXISTS" = true ]; then
            rm -rf /tmp/rhi-energy-existing-tag
            mkdir -p /tmp/rhi-energy-existing-tag
            git archive "${TAG}" dist hacs.json package.json | tar -x -C /tmp/rhi-energy-existing-tag
            diff -qr /tmp/rhi-energy-existing-tag/dist dist
            cmp /tmp/rhi-energy-existing-tag/hacs.json hacs.json
            cmp /tmp/rhi-energy-existing-tag/package.json package.json
            echo "Existing immutable tag package and HACS metadata match current candidate."
          fi

          if [ "$RELEASE_EXISTS" = true ]; then
            TAG_SHA=$(git rev-list -n 1 "${TAG}")
            RELEASE_SHA=$(gh release view "${TAG}" --json targetCommitish --jq '.targetCommitish')
            test "$RELEASE_SHA" = "$TAG_SHA"
            test "$(gh release view "${TAG}" --json isPrerelease --jq '.isPrerelease')" = false
            test "$(gh release view "${TAG}" --json assets --jq '.assets | length')" = 0
          fi
      - name: HACS validation
        uses: hacs/action@885037da508419fd08c13515967aec868dfdee2d
        with:
          category: plugin

  publish:
    name: Publish or verify immutable TEST CANDIDATE
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify exact committed HACS package
        run: |
          python validation/validate_hacs_package.py
          python validation/test_hacs_install.py
      - name: Publish or verify immutable tag and asset-free release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_SHA=$(git rev-list -n 1 "${TAG}")
            rm -rf /tmp/rhi-energy-existing-tag
            mkdir -p /tmp/rhi-energy-existing-tag
            git archive "${TAG}" dist hacs.json package.json | tar -x -C /tmp/rhi-energy-existing-tag
            diff -qr /tmp/rhi-energy-existing-tag/dist dist
            cmp /tmp/rhi-energy-existing-tag/hacs.json hacs.json
            cmp /tmp/rhi-energy-existing-tag/package.json package.json
            echo "Immutable tag ${TAG} already exists with identical package bytes and HACS metadata."
          else
            TAG_SHA="$CANDIDATE_SHA"
            git tag "${TAG}" "$TAG_SHA"
            git push origin "${TAG}"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            RELEASE_SHA=$(gh release view "${TAG}" --json targetCommitish --jq '.targetCommitish')
            test "$RELEASE_SHA" = "$TAG_SHA"
            echo "GitHub Release ${TAG} already exists; verifying without mutation."
          else
            gh release create "${TAG}" \
              --target "$TAG_SHA" \
              --title "RHI Energy UX ${TAG} — TEST CANDIDATE" \
              --notes-file release/RELEASE_NOTES.md
          fi

          test "$(gh release view "${TAG}" --json isPrerelease --jq '.isPrerelease')" = false

          ASSET_COUNT=$(gh release view "${TAG}" --json assets --jq '.assets | length')
          test "$ASSET_COUNT" = 0
      - name: Summary
        run: |
          VERSION=$(node -p "require('./package.json').version")
          {
            echo '## RHI Energy UX HACS publication'
            echo "- Version: v${VERSION}"
            echo "- HACS install source: immutable tag dist/ tree"
            echo "- GitHub Release assets: NONE (required so HACS installs immutable tag dist/ tree)"
            echo "- HACS release-asset override: DISABLED"
            echo "- Existing identical candidate: verified idempotently"
            echo "- Rebuild during publication: NO"
            echo "- Immutable HACS-visible TEST CANDIDATE: READY"
          } >> "$GITHUB_STEP_SUMMARY"

  # Isolated diagnostic archive: never changes HACS publisher authorization.
  runtime-qa:
    permissions:
      contents: write
    name: Build isolated non-HACS TEST archive
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      QA_TAG: runtime-qa-20261016-c4
      QA_COMPONENT: rhi-energy-ux
    steps:
      - name: Checkout the validated exact main commit
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: Require exact validated main and new immutable QA tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA"
          test -f "dist/$QA_COMPONENT.js"
          test -f hacs.json
          if git show-ref --verify --quiet "refs/tags/$QA_TAG"; then
            echo "Immutable QA tag already exists. Never overwrite." >&2
            exit 1
          fi
      - name: Stage runtime-only source and SHA256 provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-stage
          cp -a dist qa-stage/dist
          cp hacs.json qa-stage/hacs.json
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path("qa-stage")
          component=os.environ["QA_COMPONENT"]
          manifest=json.loads(Path("package.json").read_text())
          files={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in sorted(root.rglob("*")) if p.is_file()}
          evidence={"kind":"RHI_RUNTIME_QA_ARCHIVE_V1","channel":"MANUAL_INSTALL_ONLY",
                    "source_repository":os.environ["GITHUB_REPOSITORY"],
                    "source_sha":os.environ["SOURCE_SHA"],"qa_tag":os.environ["QA_TAG"],
                    "component":component,"manifest_version":manifest["version"],
                    "files_sha256":files,"stable_approved":False,
                    "hacs_mirror_published":False,"runtime_verified":False}
          (root/"QA_SOURCE_LOCK.json").write_text(json.dumps(evidence,indent=2)+"\n")
          (root/"QA_INSTALL_README.txt").write_text(
              "RHI source-pinned runtime QA, NOT a HACS release or stable version.\n"
              "Back up Home Assistant and record the five previously installed packages.\n"
              "Keep automatic vehicle/battery commands disabled; HOLD must not execute.\n"
              "Copy dist assets into HA config/www; register matching /local/ JS resource.\n"
              "Refresh browser cache and resources; package version is deliberately unchanged.\n"
              "Verify physical native HA states/quality and browser UX readback.\n"
              "Rollback the entire coherent five-package stack from a verified backup.\n"
              "Coordinate actual acceptance and issues in Foundation #129.\n")
          PY
          (cd qa-stage && find . -type f ! -name FILE_SHA256SUMS.txt | LC_ALL=C sort | sed 's#^\./##' | while IFS= read -r p; do sha256sum "$p"; done > FILE_SHA256SUMS.txt)
          (cd qa-stage && sha256sum -c FILE_SHA256SUMS.txt)
          (cd qa-stage && zip -X -q -r "../energy-ux-runtime-qa-20261016-c4.zip" .)
          sha256sum energy-ux-runtime-qa-20261016-c4.zip > energy-ux-runtime-qa-20261016-c4.zip.sha256
      - name: Publish immutable private QA prerelease only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$QA_TAG" >/dev/null 2>&1; then
            echo "QA release already exists; refusing overwrite." >&2
            exit 1
          fi
          gh release create "$QA_TAG" \
            energy-ux-runtime-qa-20261016-c4.zip \
            energy-ux-runtime-qa-20261016-c4.zip.sha256 \
            --target "$SOURCE_SHA" --prerelease --latest=false \
            --title "RHI energy-ux Runtime QA C4 — NOT HACS / NOT STABLE" \
            --notes "Isolated exact-source Runtime QA archive for manual HA validation. Source: $SOURCE_SHA. No public HACS mirror mutation or production approval. Verify checksum, backup, controls HOLD and coordinated rollback. Foundation #129 remains open."
          test "$(gh release view "$QA_TAG" --json isPrerelease --jq .isPrerelease)" = true
          test "$(gh release view "$QA_TAG" --json assets --jq '.assets | length')" = 2
