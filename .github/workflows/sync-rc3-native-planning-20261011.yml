name: Synchronize native Energy UX rc3 immutable candidate (single use)
on:
  push:
    branches: [fix/native-planning-quality-20261011]
    paths: [.github/workflows/sync-rc3-native-planning-20261011.yml]
permissions:
  contents: write
jobs:
  sync-and-qualify:
    if: github.ref == 'refs/heads/fix/native-planning-quality-20261011'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/native-planning-quality-20261011
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize version identity and fully validate
        run: |
          python tools/sync-release-metadata.py
          npm ci
          npm run validate
          npm run test:release
          node tools/check-committed-dist.mjs || test "$?" -eq 1
      - name: Commit exact native dist and retire temporary workflows
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sync-rc3-native-planning-20261011.yml
          git rm .github/workflows/verify-native-planning-quality-20261011.yml
          git add -A package.json package-lock.json COMPATIBILITY.json RELEASE_MANIFEST.json release/ dist/
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'release: synchronize Energy rc3 native planning source and deterministic HACS package'
          node tools/check-committed-dist.mjs
          git push origin HEAD:refs/heads/fix/native-planning-quality-20261011
