name: Native Energy deterministic dist (single use)
on:
  push:
    branches: [work/ux-structural-closure-20261011]
    paths: [.github/workflows/rebuild-energy-native-dist-20261011.yml]
permissions:
  contents: write
jobs:
  rebuild:
    if: github.ref == 'refs/heads/work/ux-structural-closure-20261011'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ux-structural-closure-20261011
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild exact native source, guard contracts
        run: |
          npm ci
          npm run build
          npm run check:canonical-only
          node --check dist/rhi-energy-ux.js
      - name: Commit generated bytes and remove temporary builder
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/rebuild-energy-native-dist-20261011.yml
          git add -A dist/
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'build: synchronize native canonical Energy HACS dist with validated source'
          git push origin HEAD:refs/heads/work/ux-structural-closure-20261011
