name: Prepare Power Flow Card HACS candidate (temporary)
on:
  push:
    branches: [feat/power-flow-card-integration-20261011]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feat/power-flow-card-integration-20261011
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python tools/sync-release-metadata.py
      - run: npm ci
      - run: npm run validate
      - run: npm run release:check
      - name: Commit deterministic governed HACS distribution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist package.json package-lock.json COMPATIBILITY.json RELEASE_MANIFEST.json release/RELEASE_STATUS.json release/QUALIFICATION.json
          if ! git diff --cached --quiet; then
            git commit -m "build(energy): verified 4.3.36-rc.10 HACS package"
            git push origin HEAD:feat/power-flow-card-integration-20261011
          fi
