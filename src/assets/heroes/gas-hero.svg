<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">Gas consumption insights</title>
<desc id="desc">Robotix Home Intelligence gas hero with a home, smart meter and consumption trend.</desc>
<defs>
